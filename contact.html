<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Fashion 'N' Joy</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <h1 class="logo"><i class="fa-solid fa-shirt"></i> Fashion 'N' Joy</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <section class="contact">
    <h2>Get in Touch</h2>
    <p>We’d love to hear from you! Fill in the form below.</p>
    <form name="contactForm" onsubmit="return validateForm()">
      <div class="input-group">
        <input type="text" name="name" placeholder="Enter your Name" />
        <input type="email" name="email" placeholder="Enter your Email" />
      </div>
      <textarea name="message" placeholder="Your Message Here..." rows="5"></textarea>
      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Fashion 'N' Joy | Designed with ♥</p>
  </footer>
</body>
</html>
